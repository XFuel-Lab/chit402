[package]
name = "xfuel-solana-prover"
version = "0.1.0"
edition = "2021"
description = "XFuel Protocol — Solana SVM SP1 Groth16 ZK Verifier for DePIN"
license = "MIT"

[features]
default = []
no-entrypoint = []
test-sbf = []

[dependencies]
solana-program = "2.1"
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
solana-program-test = "2.1"
solana-sdk = "2.1"
tokio = { version = "1", features = ["full"] }

[lib]
crate-type = ["cdylib", "lib"]
name = "xfuel_solana_prover"
