[profile.default]
src = "contracts/witness"
out = "out"
libs = ["lib"]
test = "test/foundry"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
fs_permissions = [{ access = "read", path = "./" }]
gas_reports = ["ChitLogWitness"]

[fuzz]
runs = 64

[invariant]
runs = 32
depth = 15
fail_on_revert = false

# Base Sepolia only. No mainnet RPC endpoint is configured.
[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
