global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # XFuel fee-analytics Prometheus endpoint (:9100)
  # Start with:  node fee-analytics.js --format prometheus --watch --port 9100
  - job_name: "xfuel-fee-analytics"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: "fee-analytics"
          environment: "local"

    # If running fee-analytics inside Docker on xfuel-network, use:
    #   targets: ["xfuel-backend:9100"]

  # XFuel M2M API health endpoint (:3002)
  # The /health endpoint returns JSON, not Prometheus format.
  # Use a json_exporter sidecar or metric_relabel if needed.
  # For now, fee-analytics.js already proxies /health data into
  # its Prometheus output, so this is covered by the job above.
