[package]
name = "fee-collector"
version = "0.1.0"
authors = ["XFuel Protocol <team@xfuel.io>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# For production builds, optimize for size
default = ["cranelift"]
cranelift = []
# Use this feature for testing
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = "1.5"
cw-storage-plus = "1.2"
cw2 = "1.1"
cw20 = "2.0"
cw20-base = { version = "1.1", features = ["library"] }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cosmwasm-vm = "1.5"
cw-multi-test = "0.20"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
