[package]
name = "persistence-minter"
version = "1.0.0"
authors = ["XFuelLab <dev@xfuel.io>"]
edition = "2021"
description = "XFuel Persistence Minter - ZK-verified ibcTFUEL token with LST staking integration"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[profile.release.package."*"]
opt-level = 3
debug = false

[features]
# use library feature to disable all instantiate/execute/query exports
library = []
# Backtraces for better error debugging
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = "1.5.0"
cosmwasm-storage = "1.5.0"
cw-storage-plus = "1.2.0"
cw2 = "1.1.0"
cw20 = "2.0.0"
cw20-base = { version = "1.1.0", features = ["library"] }
schemars = "0.8.16"
serde = { version = "1.0.195", default-features = false, features = ["derive"] }
thiserror = "1.0.56"
sha2 = "0.10.8"

[dev-dependencies]
cw-multi-test = "0.20.0"
cosmwasm-schema = "1.5.0"

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/rust-optimizer:0.15.1
"""

