[workspace]
members = [
    # CosmWasm BN254 Groth16 verifier for Cosmos chains (CertiK Phase 1 audit scope).
    "cosmwasm/zk-verifier",
    # "services/sp1-prover/program",  # Unix-only: sp1-jit v6.0.2 uses std::os::fd (Linux/macOS only)
    # "services/sp1-prover/host",     # Unix-only: depends on services/sp1-prover/program + sp1-jit

    # ── Core Layer (ecosystem-agnostic modules) ──────────────────────────
    "core-layer/wasm/zk-verifier",
    "core-layer/wasm/revenue-splitter",
    "core-layer/sp1-hooks",
]

resolver = "2"

# Add workspace dependencies for sp1-prover compatibility (if re-enabled)
[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

