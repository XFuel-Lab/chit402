[workspace]
members = [
    "cosmwasm/zk-verifier",
    "cosmwasm/ibc-tfuel-minter",
    "sp1-prover/program",
    "sp1-prover/host",
]

resolver = "2"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

