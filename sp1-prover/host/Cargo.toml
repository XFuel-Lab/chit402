[package]
name = "deposit-proof-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prove"
path = "src/main.rs"

[dependencies]
sp1-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
bincode = "1.3"
base64 = "0.22"

[features]
default = []
# CUDA is automatically detected by SP1 SDK at runtime
# No special feature flag needed!

[profile.release]
opt-level = 3
lto = true
codegen-units = 1