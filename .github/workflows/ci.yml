name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Path-change detection ──────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'core-layer/**'
              - 'test/**'
              - 'hardhat.config.cjs'
              - 'scripts/hardhat-*.cjs'
              - '.solcover.cjs'
            sdk:
              - 'packages/sdk/**'

  # ── SDK unit tests (Jest + TypeScript) ─────────────────────
  # Runs on push to main, or on PRs that touch packages/sdk/.
  jest:
    name: Jest Unit Tests (SDK)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.sdk == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - name: Install SDK test dependencies
        run: npm ci --prefix packages/sdk

      - name: Run Jest unit tests (xfuel-sdk)
        run: npm test --prefix packages/sdk -- --ci --coverage=false

  # ── Solidity compile + core contract tests ──────────────────
  # Runs on push to main, or on PRs that touch contracts/core-layer/test paths.
  contracts-core:
    name: Core Contract Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Generate TypeChain types
        run: npm run typechain

      - name: Core listener (node:test)
        run: npm run test:contracts:core:listener

      - name: Core contracts + security (Hardhat)
        run: npm run test:contracts:core:solidity

  # ── Cypress E2E: no active specs ────────────────────────────
  # Legacy Theta/TFUEL/Keplr/fee-splitter specs live under
  # cypress/_archive/e2e/ (see cypress/_archive/README.md).
  # npm run test:e2e:headless is a no-op skip until new Base/x402
  # specs are added under cypress/e2e/.
  # e2e:
  #   name: Cypress E2E
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-node@v7
  #       with: { node-version: '20', cache: 'npm' }
  #     - run: npm ci
  #     - run: npm run dev &
  #     - run: npm run test:e2e:headless
  #       env: { CYPRESS_baseUrl: 'http://localhost:3000' }
