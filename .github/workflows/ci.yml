name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Frontend unit tests (Jest + TypeScript) ─────────────────
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - name: Run Jest unit tests
        run: npm test -- --ci --coverage=false

  # ── Solidity compile + core contract tests ──────────────────
  contracts-core:
    name: Core Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts
        run: npx hardhat compile
        env:
          HARDHAT_FAST: "true"

      - name: Generate TypeChain types
        run: npm run typechain
        env:
          HARDHAT_FAST: "true"

      - name: Run core + security tests
        run: npm run test:contracts:core
        env:
          HARDHAT_FAST: "true"

  # ── Cypress E2E: disabled until wallet mocking is set up ────
  # These require Theta Wallet / Keplr browser extensions and are
  # best run locally or in a dedicated browser-automation environment.
  # Uncomment and configure when a wallet mock layer is added.
