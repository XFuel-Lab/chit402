name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Path-change detection ──────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'core-layer/**'
              - 'test/**'
              - 'hardhat.config.cjs'
              - 'scripts/hardhat-*.cjs'
              - '.solcover.cjs'
            sdk:
              - 'packages/sdk/**'

  # ── SDK unit tests (Jest + TypeScript) ─────────────────────
  # Always creates a check. Runs real tests only when packages/sdk/** changes.
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: No SDK changes — skipped
        if: needs.changes.outputs.sdk != 'true' && github.event_name != 'push'
        run: echo "No SDK changes detected; skipping Jest tests."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install root dependencies
        if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
        run: npm ci

      - name: Install SDK test dependencies
        if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
        run: npm ci --prefix packages/sdk

      - name: Run Jest unit tests (xfuel-sdk)
        if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
        run: npm test --prefix packages/sdk -- --ci --coverage=false

  # ════════════════════════════════════════════════════════════
  # TEMPORARY COMPATIBILITY ALIAS (remove after branch protection update)
  # Satisfies branch protection requiring PR 280's name "Jest Unit Tests (SDK)".
  # ════════════════════════════════════════════════════════════
  compat-jest-sdk:
    name: Jest Unit Tests (SDK)
    runs-on: ubuntu-latest
    needs: jest
    steps:
      - name: Compatibility gate (temporary)
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║ TEMPORARY COMPATIBILITY CHECK                                ║"
          echo "║                                                              ║"
          echo "║ Real SDK tests run as: CI / Jest Unit Tests                  ║"
          echo "║ This alias satisfies branch protection requiring the         ║"
          echo "║ PR 280 name 'Jest Unit Tests (SDK)'.                         ║"
          echo "║                                                              ║"
          echo "║ Remove this job after updating branch protection rules.      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # ── Solidity compile + core contract tests ──────────────────
  # Always creates a check. Runs real tests only when contracts/core-layer/test paths change.
  contracts-core:
    name: Core Contract Tests
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: No contract changes — skipped
        if: needs.changes.outputs.contracts != 'true' && github.event_name != 'push'
        run: echo "No contract/listener changes detected; skipping core tests."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
        run: npm ci

      - name: Compile contracts
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
        run: npx hardhat compile

      - name: Generate TypeChain types
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
        run: npm run typechain

      - name: Core listener (node:test)
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
        run: npm run test:contracts:core:listener

      - name: Core contracts + security (Hardhat)
        if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
        run: npm run test:contracts:core:solidity

  # ── Cypress E2E: no active specs ────────────────────────────
  # Legacy Theta/TFUEL/Keplr/fee-splitter specs live under
  # cypress/_archive/e2e/ (see cypress/_archive/README.md).
  # npm run test:e2e:headless is a no-op skip until new Base/x402
  # specs are added under cypress/e2e/.
  # e2e:
  #   name: Cypress E2E
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-node@v7
  #       with: { node-version: '20', cache: 'npm' }
  #     - run: npm ci
  #     - run: npm run dev &
  #     - run: npm run test:e2e:headless
  #       env: { CYPRESS_baseUrl: 'http://localhost:3000' }
