name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Core listener (node:test) + full Hardhat suite + coverage ─────────────
  solidity:
    name: Contracts & Core Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Generate TypeChain types
        run: npm run typechain

      - name: Core listener (node:test)
        run: npm run test:contracts:core:listener

      # Windows-safe explicit file list (scripts/hardhat-test-all.cjs). Failing tests here
      # are tracked separately from the core gate in ci.yml (test:contracts:core:solidity).
      - name: Full Hardhat suite (test + circuits + security)
        run: npm run test:contracts:all:hardhat

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solidity-coverage
          path: coverage/

      - name: Gas report (Hardhat core subset)
        run: npm run test:contracts:core:solidity
        env:
          REPORT_GAS: "true"

  # ── M2M backend (webhooks + x402) + SDK + Agent Skills ───────
  m2m-sdk-skills:
    name: M2M Backend + SDK + Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install M2M backend deps
        working-directory: services/gateway
        run: npm install --no-audit --no-fund

      - name: M2M backend tests (webhooks + x402 adapter)
        working-directory: services/gateway
        run: npm test

      - name: Install SDK deps
        working-directory: packages/sdk
        run: npm install --no-audit --no-fund

      - name: Install theta-inference circuit deps (ethers for handler tests)
        working-directory: packages/circuit-runtime/theta-inference
        run: npm install --no-audit --no-fund

      - name: SDK build + tests (REST client + on-chain module)
        working-directory: packages/sdk
        run: |
          npm run build
          npm test

      - name: ComputeRouter + _executeService regression tests
        run: node --test packages/circuit-runtime/theta-inference/test/compute-router.test.mjs packages/circuit-runtime/theta-inference/test/execute-service.test.mjs

      - name: Validate Agent Skills (SKILL.md frontmatter)
        run: node scripts/validate-skills.cjs

  # ── CosmWasm Rust tests ──────────────────────────────────────
  cosmwasm:
    name: CosmWasm Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/cosmwasm/sp1-verifier
            contracts/cosmwasm/revenue-splitter

      - name: Run ZK verifier tests
        working-directory: contracts/cosmwasm/sp1-verifier
        run: cargo test

      - name: Run revenue splitter tests
        working-directory: contracts/cosmwasm/revenue-splitter
        run: cargo test

  # ── XFuel zkLLM prover (Phase 5 / Verified Inference Tier-3) ──
  zkllm:
    name: zkLLM Prover Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/zkllm-prover

      # Soundness + tamper-rejection suite for the self-owned ZK prover core
      # (matmul, lookups, activation, norm, attention, block, requant, spot-check).
      - name: Run xfuel-zkp tests
        working-directory: services/zkllm-prover
        run: cargo test

      # Keep the RAM/time benchmark harness (examples) compiling.
      - name: Build benchmark examples
        working-directory: services/zkllm-prover
        run: cargo build --examples

  # ── Slither static analysis ──────────────────────────────────
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts (needed for Slither)
        run: npx hardhat compile

      - name: Install Slither
        run: pip3 install "slither-analyzer>=0.10.0,<0.11.0"

      - name: Run Slither on core contracts
        run: |
          slither . \
            --ignore-compile \
            --config-file slither.config.json \
            --include-paths "contracts/core" \
            --exclude-dependencies \
            --exclude naming-convention,solc-version \
            --json slither-report.json || true

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither-report
          path: slither-report.json

      # Ensures the branch includes the triage table; otherwise known core false positives fail the job.
      - name: Verify Slither core counter (triage present)
        run: grep -q '_TRIAGED_CORE_HIGH' scripts/slither-count-high-core.py

      # Slither JSON includes all contracts; --include-paths does not trim the file.
      # Gate only on High/Medium-confidence findings whose elements touch contracts/core/.
      - name: Fail on high-severity findings (contracts/core)
        run: |
          if [ -f slither-report.json ]; then
            HIGH=$(python3 scripts/slither-count-high-core.py slither-report.json)
            echo "High-severity findings (contracts/core scope): $HIGH"
            if ! [[ "$HIGH" =~ ^[0-9]+$ ]]; then
              echo "Slither counter did not print a number (got: '$HIGH'). Check scripts/slither-count-high-core.py."
              exit 1
            fi
            if [ "$HIGH" -gt "0" ]; then
              echo "❌ Slither found $HIGH high-severity issue(s) in contracts/core. Review slither-report.json artifact."
              exit 1
            fi
            echo "✅ No high-severity Slither findings in contracts/core."
          fi
