name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    # ready_for_review is not in the default set. A draft open that does not
    # start Actions would otherwise never run when the PR is marked ready.
    # cursor/spend-hold-ceiling-0d9c is PR #495.
    # cursor/gateway-v11-issuer-root-5306 is the base of stacked draft #499.
    # cursor/verify-head-issuer-bind-ce2e was the #492 stack. The filter matches
    # those bases so Verify package (Windows) runs.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop, cursor/spend-hold-ceiling-0d9c, cursor/gateway-v11-issuer-root-5306, cursor/verify-head-issuer-bind-ce2e]

jobs:
  public-identifiers:
    name: Public identifier guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard unit tests
        run: node --test scripts/check-public-identifiers.test.mjs
      - name: Scan tracked files
        run: node scripts/check-public-identifiers.mjs

  # ── Path-change detection ──────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      theta-inference: ${{ steps.filter.outputs.theta-inference }}
      skills: ${{ steps.filter.outputs.skills }}
      zkllm: ${{ steps.filter.outputs.zkllm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'core-layer/**'
              - 'test/**'
              - 'hardhat.config.cjs'
              - 'scripts/hardhat-*.cjs'
              - '.solcover.cjs'
            gateway:
              - 'services/gateway/**'
            web:
              - 'apps/web/**'
              - 'api/**'
              - 'scripts/check-solana-audit-bundle.mjs'
              - '.github/workflows/test.yml'
            theta-inference:
              - 'packages/circuit-runtime/theta-inference/**'
            skills:
              - 'packages/agent-skills/**'
            zkllm:
              - 'services/zkllm-prover/**'

  # ── Surplus x402 → Chit receipt demo (mocked; no network in tests) ─
  surplus-x402:
    name: Surplus x402 receipt demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Test examples/surplus-x402
        working-directory: examples/surplus-x402
        run: npm install --no-audit --no-fund && npm test

  # ── Cloudflare x402 buyer proxy → Chit receipt (mocked fetch) ─
  cloudflare-x402-chit-receipt:
    name: Cloudflare x402 Chit receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Test examples/cloudflare-x402-chit-receipt
        working-directory: examples/cloudflare-x402-chit-receipt
        run: npm install --no-audit --no-fund && npm test

  # ── Gateway tests (always run on PRs) ──────────────────────
  # Receipt signing, JWKS, x402 adapter, HMAC validation.
  gateway:
    name: Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install gateway deps
        working-directory: services/gateway
        run: npm install --no-audit --no-fund

      - name: Install and build @xfuel/verify
        working-directory: packages/verify
        run: npm install --no-audit --no-fund && npm run build

      - name: Gateway tests (receipts + x402 adapter)
        working-directory: services/gateway
        run: npm test

  # ── CDP spend store (Linux + Windows) ──────────────────────
  # Two-process cap test uses node:child_process and node:path.
  cdp-spend-store:
    name: CDP spend store
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install gateway deps
        working-directory: services/gateway
        # The gateway postinstall installs theta-inference by calling npm
        # again. On Windows that recursion exits before these tests run.
        # The spend-store suite only needs the gateway's own dependencies.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test @chit402/cdp-spend-store
        working-directory: packages/cdp-spend-store
        run: npm install --no-audit --no-fund && npm test

  # ── @xfuel/verify on Windows (Node 24) ─────────────────────
  # Linux CI does not run this package's own suite. npm publish runs it
  # via prepublishOnly, and two tests fail only on Windows (ESM file URL
  # for --import, and process exit while undici sockets are closing).
  verify-windows:
    name: Verify package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test @xfuel/verify
        working-directory: packages/verify
        run: npm install --no-audit --no-fund && npm test

  # ── www unit tests (path-filtered) ─────────────────────────
  # apps/web is not covered by Gateway Tests or Jest (Jest is packages/sdk).
  web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install and test www with no network
        working-directory: apps/web
        run: npm install --no-audit --no-fund && unshare -rn npm test

  solana-audit-bundle:
    name: Solana audit bundle secret scan
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the web app with a dummy Helius key
        working-directory: apps/web
        env:
          HELIUS_API_KEY: SECRETDUMMYHELIUSKEY01
        run: npm install --no-audit --no-fund && npm run build

      - name: Grep built JS and source maps
        run: node scripts/check-solana-audit-bundle.mjs

  # ════════════════════════════════════════════════════════════
  # TEMPORARY COMPATIBILITY ALIASES (remove after branch protection update)
  # These satisfy old required check names until founder updates settings.
  # ════════════════════════════════════════════════════════════

  # Old required name from test.yml before PR 280.
  # Real contract tests now run in ci.yml "Core Contract Tests" (path-filtered).
  # Full Hardhat+coverage+gas runs in "Contracts Full Suite" (push-only).
  compat-contracts-listener:
    name: Contracts & Core Listener
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility gate (temporary)
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║ TEMPORARY COMPATIBILITY CHECK                                ║"
          echo "║                                                              ║"
          echo "║ Real contract tests now run as:                              ║"
          echo "║   • CI / Core Contract Tests (path-filtered, PR gate)        ║"
          echo "║   • Tests / Contracts Full Suite (push to main only)         ║"
          echo "║                                                              ║"
          echo "║ Remove this job after updating branch protection rules.      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # Old required name from test.yml before PR 280.
  # Gateway tests now run as "Gateway Tests" (always).
  # SDK tests run in ci.yml "Jest Unit Tests" (path-filtered).
  compat-m2m-sdk-skills:
    name: M2M Backend + SDK + Skills
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility gate (temporary)
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║ TEMPORARY COMPATIBILITY CHECK                                ║"
          echo "║                                                              ║"
          echo "║ These tests are now split into:                              ║"
          echo "║   • Tests / Gateway Tests (always runs)                      ║"
          echo "║   • CI / Jest Unit Tests (SDK, path-filtered)                ║"
          echo "║   • Tests / Theta-Inference Circuit Tests (path-filtered)    ║"
          echo "║   • Tests / Agent Skills Validation (path-filtered)          ║"
          echo "║                                                              ║"
          echo "║ Remove this job after updating branch protection rules.      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # ════════════════════════════════════════════════════════════
  # END TEMPORARY COMPATIBILITY ALIASES
  # ════════════════════════════════════════════════════════════

  # ── Full Hardhat suite + coverage (push to main only) ──────
  # Compile + full test suite + coverage + gas report.
  # Does NOT block PR merge — runs on push to main for audit trail.
  solidity:
    name: Contracts Full Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Generate TypeChain types
        run: npm run typechain

      - name: Core listener (node:test)
        run: npm run test:contracts:core:listener

      - name: Full Hardhat suite (test + circuits + security)
        run: npm run test:contracts:all:hardhat

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solidity-coverage
          path: coverage/

      - name: Gas report (Hardhat core subset)
        run: npm run test:contracts:core:solidity
        env:
          REPORT_GAS: "true"

  # ── Theta-inference circuit tests (path-filtered) ──────────
  # Runs on push to main, or on PRs touching theta-inference paths.
  theta-inference:
    name: Theta-Inference Circuit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.theta-inference == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install theta-inference deps
        working-directory: packages/circuit-runtime/theta-inference
        run: npm install --no-audit --no-fund

      - name: ComputeRouter + _executeService regression tests
        run: node --test packages/circuit-runtime/theta-inference/test/compute-router.test.mjs packages/circuit-runtime/theta-inference/test/execute-service.test.mjs

  # ── Agent Skills validation (path-filtered) ─────────────────
  # Runs on push to main, or on PRs touching agent-skills paths.
  skills:
    name: Agent Skills Validation
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.skills == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Validate Agent Skills (SKILL.md frontmatter)
        run: node scripts/validate-skills.cjs

  # ── XFuel zkLLM prover (push to main or path change) ───────
  # Tier-3 Verified Inference soundness + tamper-rejection suite.
  zkllm:
    name: zkLLM Prover Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.zkllm == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/zkllm-prover

      - name: Run xfuel-zkp tests
        working-directory: services/zkllm-prover
        run: cargo test

      - name: Build benchmark examples
        working-directory: services/zkllm-prover
        run: cargo build --examples

  # ── Slither static analysis (push to main or contracts change) ──
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts (needed for Slither)
        run: npx hardhat compile

      - name: Install Slither
        run: pip3 install "slither-analyzer>=0.10.0,<0.11.0"

      - name: Run Slither on core contracts
        run: |
          slither . \
            --ignore-compile \
            --config-file slither.config.json \
            --include-paths "contracts/core" \
            --exclude-dependencies \
            --exclude naming-convention,solc-version \
            --json slither-report.json || true

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither-report
          path: slither-report.json

      - name: Verify Slither core counter (triage present)
        run: grep -q '_TRIAGED_CORE_HIGH' scripts/slither-count-high-core.py

      - name: Fail on high-severity findings (contracts/core)
        run: |
          if [ -f slither-report.json ]; then
            HIGH=$(python3 scripts/slither-count-high-core.py slither-report.json)
            echo "High-severity findings (contracts/core scope): $HIGH"
            if ! [[ "$HIGH" =~ ^[0-9]+$ ]]; then
              echo "Slither counter did not print a number (got: '$HIGH'). Check scripts/slither-count-high-core.py."
              exit 1
            fi
            if [ "$HIGH" -gt "0" ]; then
              echo "❌ Slither found $HIGH high-severity issue(s) in contracts/core. Review slither-report.json artifact."
              exit 1
            fi
            echo "✅ No high-severity Slither findings in contracts/core."
          fi
