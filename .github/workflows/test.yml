name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    # ready_for_review is not in the default set. A draft open that does not
    # start Actions would otherwise never run when the PR is marked ready.
    # cursor/spend-hold-ceiling-0d9c is PR #495.
    # cursor/gateway-v11-issuer-root-5306 is the base of stacked draft #499.
    # cursor/verify-head-issuer-bind-ce2e was the #492 stack. The filter matches
    # those bases so Verify package (Windows) runs.
    # verify/redesign-* is the stacked verifier redesign (each PR is based on
    # the previous one).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop, cursor/spend-hold-ceiling-0d9c, cursor/gateway-v11-issuer-root-5306, cursor/verify-head-issuer-bind-ce2e, 'verify/redesign-*']

jobs:
  public-identifiers:
    name: Public identifier guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard unit tests
        run: node --test scripts/check-public-identifiers.test.mjs
      - name: Scan tracked files
        run: node scripts/check-public-identifiers.mjs

  # ── Root dotenv pin (hardhat.config.cjs, verify-deployment.cjs) ─
  # scripts/lib/dotenv-load.cjs pins every dotenv option so DOTENV_* env
  # cannot change which file loads or let .env overwrite exported deploy
  # keys. Runs on the root lock's dotenv and again on dotenv 18 (not saved).
  # no-key-print.test.mjs loads the hardhat config with dummy keys and
  # checks no part of a key is printed.
  root-dotenv-pin:
    name: Root dotenv pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install root deps (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pin tests on the locked dotenv
        run: node --test scripts/lib/dotenv-load.test.mjs scripts/lib/no-key-print.test.mjs
      - name: Pin tests on dotenv 18
        # The tarball is checked against the sha512 the registry published for
        # 18.0.9 (the same integrity Dependabot #655 locks) before install.
        run: |
          curl -fsSL https://registry.npmjs.org/dotenv/-/dotenv-18.0.9.tgz -o "$RUNNER_TEMP/dotenv-18.0.9.tgz"
          want="3fVOW4cB02R066PUSwn8O4TJyz9NckQl7F81blIbaq9jKBm2tSmOKky7ZHIXzGvkVPXCSn6jkpziBPZdGFs8Tw=="
          got="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/dotenv-18.0.9.tgz" | base64 -w0)"
          if [ "$got" != "$want" ]; then echo "::error::dotenv-18.0.9.tgz sha512 mismatch: $got"; exit 1; fi
          npm install --no-save --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/dotenv-18.0.9.tgz"
          node -e "const v=require('dotenv/package.json').version; if (v !== '18.0.9') { console.error('dotenv is ' + v); process.exit(1) }"
          node --test scripts/lib/dotenv-load.test.mjs scripts/lib/no-key-print.test.mjs

  # ── Path-change detection ──────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      theta-inference: ${{ steps.filter.outputs.theta-inference }}
      skills: ${{ steps.filter.outputs.skills }}
      zkllm: ${{ steps.filter.outputs.zkllm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'core-layer/**'
              - 'test/**'
              - 'hardhat.config.cjs'
              - 'scripts/hardhat-*.cjs'
              - '.solcover.cjs'
            gateway:
              - 'services/gateway/**'
            web:
              - 'apps/web/**'
              - 'api/**'
              - 'scripts/check-solana-audit-bundle.mjs'
              - 'scripts/verify-1f916-link.mjs'
              - 'scripts/fixtures/1f916*'
              - '.github/workflows/test.yml'
            theta-inference:
              - 'packages/circuit-runtime/theta-inference/**'
            skills:
              - 'packages/agent-skills/**'
            zkllm:
              - 'services/zkllm-prover/**'

  # ── Surplus x402 → Chit receipt demo (mocked; no network in tests) ─
  surplus-x402:
    name: Surplus x402 receipt demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Test examples/surplus-x402
        working-directory: examples/surplus-x402
        run: npm install --no-audit --no-fund && npm test

  # ── Cloudflare x402 buyer proxy → Chit receipt (mocked fetch) ─
  cloudflare-x402-chit-receipt:
    name: Cloudflare x402 Chit receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Test examples/cloudflare-x402-chit-receipt
        working-directory: examples/cloudflare-x402-chit-receipt
        run: npm install --no-audit --no-fund && npm test

  # ── Gateway tests (always run on PRs) ──────────────────────
  # Receipt signing, JWKS, x402 adapter, HMAC validation.
  gateway:
    name: Gateway Tests
    runs-on: ubuntu-latest
    # Install and build take a few minutes; the suite takes about 300 s loaded.
    # run-tests.mjs caps the suite at 600 s and names the running file, so the
    # step and job limits sit above that cap.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install gateway deps
        working-directory: services/gateway
        run: npm install --no-audit --no-fund

      - name: Install and build @xfuel/verify
        working-directory: packages/verify
        run: npm install --no-audit --no-fund && npm run build

      - name: Gateway tests (receipts + x402 adapter)
        working-directory: services/gateway
        timeout-minutes: 12
        # CI has none of the machine-dependent skips (root, no anvil), so any
        # skip here fails. run-tests.mjs refuses a value above the manifest's.
        env:
          RUN_TESTS_MAX_SKIPPED: '0'
        run: npm test

  # ── CDP spend store (Linux + Windows) ──────────────────────
  # Two-process cap test uses node:child_process and node:path.
  cdp-spend-store:
    name: CDP spend store
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install gateway deps
        working-directory: services/gateway
        # The gateway postinstall installs theta-inference by calling npm
        # again. On Windows that recursion exits before these tests run.
        # The spend-store suite only needs the gateway's own dependencies.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test @chit402/cdp-spend-store
        working-directory: packages/cdp-spend-store
        run: npm install --no-audit --no-fund && npm test

  # ── chit402-verify ───────────────────────────────────────
  # Two tests fail only on Windows (ESM file URL for --import, and process
  # exit while undici sockets are closing). Publish is workflow_dispatch in
  # publish-verify.yml and runs this suite before npm publish --provenance.
  # Corpus gate, in three parts so no head code runs where the gate runs:
  #  1. corpus-inputs runs the head tree's synthetic cases and uploads them as
  #     data (one JSON file). Nothing else leaves this job.
  #  2. corpus-gate checks out the merge base as a worktree, builds only that
  #     tree, and runs the merge base's copy of the gate. It reads the head
  #     baseline, changes.json and registry pin through git as data, digests
  #     the head inputs itself, and runs the merge-base verifier on them for
  #     each added corpus_fix entry.
  #  3. Verify package (Linux) needs corpus-gate and fails unless it passed,
  #     so the required check cannot go green without the gate.
  corpus-inputs:
    name: Corpus inputs (head)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Export synthetic case inputs
        working-directory: packages/verify
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc
          node scripts/corpus-gate.mjs export . > "$RUNNER_TEMP/corpus-inputs.json"

      - uses: actions/upload-artifact@v7
        with:
          name: corpus-inputs
          path: ${{ runner.temp }}/corpus-inputs.json
          if-no-files-found: error
          retention-days: 5

  corpus-gate:
    name: Corpus baseline gate
    needs: corpus-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the gate can read the merge base.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v8
        with:
          name: corpus-inputs
          path: ${{ runner.temp }}/head-inputs

      - name: Corpus baseline gate (merge-base code only)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD~1)
          fi
          # The gate must come from the merge base once it has ever existed on
          # the target branch; a branch that predates it fails closed. Only
          # the change that adds it runs its own copy. Shallow history fails
          # closed.
          if [ "$EVENT_NAME" = "pull_request" ]; then histref="origin/$BASE_REF"; else histref="$base"; fi
          bash packages/verify/scripts/select-driver.sh "$GITHUB_WORKSPACE" "$histref" "$base" "$RUNNER_TEMP" \
            packages/verify/scripts/corpus-gate.mjs
          # Build the merge-base tree only. No npm ci, tsc or script from the
          # head tree runs in this job.
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          basepkg="$RUNNER_TEMP/base/packages/verify"
          if [ -f "$basepkg/package-lock.json" ]; then
            (cd "$basepkg" && npm ci --ignore-scripts --no-audit --no-fund && npx tsc)
          fi
          cd "$RUNNER_TEMP"
          node "$RUNNER_TEMP/corpus-gate.mjs" --base "$base" --root "$GITHUB_WORKSPACE" \
            --base-tree "$basepkg" --head-inputs "$RUNNER_TEMP/head-inputs/corpus-inputs.json"

  # Corpus harness diff. The corpus gate never runs head code, so it cannot
  # judge a change to the corpus harness (lib.mjs with the cli runner,
  # run-*.mjs, tape-*.mjs, record*.mjs, tapes/**, history-file.mjs,
  # golden-corpus.test.mjs, synthetic.mjs, test/fixtures/**). On a pull
  # request that touches one of them, this job runs the merge-base harness
  # and the head harness on the same merge-base cases, against the
  # merge-base verifier build, and fails on any case|path outcome
  # difference.
  #  - The driver is the merge-base copy of scripts/harness-diff.mjs and
  #    scripts/corpus-gate.mjs (scripts/select-driver.sh: a branch that
  #    predates a driver on the target branch fails closed); only the
  #    merge-base tree is built (npm ci --ignore-scripts, tsc). Head files
  #    are read through git as data.
  #  - Tripwire only: the comparator trusts the head harness's stdout, so a
  #    forged one passes. Review and code-owner protection still apply, and
  #    pushes straight to main do not run this job.
  #  - Both harnesses run in a container with no network, a read-only root
  #    and read-only mounts, no capabilities, as the runner user, with no
  #    environment passed in. The job has no secrets and only contents: read,
  #    and the checkout does not keep credentials. pull_request only.
  #  - It is not a dependency of Verify package (Linux): whether it becomes a
  #    required check is a branch-protection decision.
  harness-diff:
    name: Corpus harness diff
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Harness diff (merge-base driver; both harnesses offline in a sandbox)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          # node:22-bookworm-slim, pinned by digest (multi-arch index from
          # registry-1.docker.io, read 2026-10-22). Bump the digest on purpose.
          SANDBOX_IMAGE: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
        run: |
          set -euo pipefail
          # Git reads that resolve the merge base or its content ignore
          # replace refs and grafts.
          unset GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS
          g() { GIT_GRAFT_FILE=/dev/null git --no-replace-objects -c advice.graftFileDeprecated=false "$@"; }
          base=$(g merge-base HEAD "origin/$BASE_REF")
          drv="$RUNNER_TEMP/driver"
          # Each driver must come from the merge base once it has ever existed
          # on the target branch; a branch that predates it fails closed (merge
          # the target branch in). Only the change that adds a driver runs its
          # own copy, with a notice. A shallow, partial or treeless clone
          # fails closed.
          bash packages/verify/scripts/select-driver.sh "$GITHUB_WORKSPACE" "origin/$BASE_REF" "$base" "$drv" \
            packages/verify/scripts/corpus-gate.mjs packages/verify/scripts/harness-diff.mjs
          changed=$(node "$drv/harness-diff.mjs" changed "$GITHUB_WORKSPACE" "$base" HEAD)
          own=$(g diff --name-only "$base" HEAD -- .github/workflows/test.yml packages/verify/scripts/harness-diff.mjs packages/verify/scripts/select-driver.sh)
          if [ -z "$changed" ] && [ -z "$own" ]; then
            echo "No corpus harness file changed; nothing to diff."
            exit 0
          fi
          printf 'Corpus harness files changed:\n%s\n' "${changed:-(none; the job itself changed, so it runs as a self-check)}"
          g worktree add --detach "$RUNNER_TEMP/base" "$base"
          basepkg="$RUNNER_TEMP/base/packages/verify"
          (cd "$basepkg" && npm ci --ignore-scripts --no-audit --no-fund && npx tsc)
          node "$drv/harness-diff.mjs" overlay "$basepkg" "$GITHUB_WORKSPACE" HEAD "$RUNNER_TEMP/head"
          node "$drv/harness-diff.mjs" cases "$basepkg" "$RUNNER_TEMP/cases"
          docker pull -q "$SANDBOX_IMAGE"
          sandbox() {
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,size=2g \
              --pids-limit 512 --memory 2g --memory-swap 2g --cpus 2 \
              --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
              -v "$drv:$drv:ro" -v "$basepkg:$basepkg:ro" -v "$RUNNER_TEMP/head:$RUNNER_TEMP/head:ro" \
              -v "$RUNNER_TEMP/cases:$RUNNER_TEMP/cases:ro" -w /tmp \
              "$SANDBOX_IMAGE" node "$drv/harness-diff.mjs" outcomes "$1" "$RUNNER_TEMP/cases/cases.json"
          }
          sandbox "$basepkg" > "$RUNNER_TEMP/outcomes-base.json"
          sandbox "$RUNNER_TEMP/head" > "$RUNNER_TEMP/outcomes-head.json"
          # The comparator trusts each sandbox's stdout, and the head harness
          # writes the head side: a harness that forges base-looking outcomes
          # passes. This job is a tripwire for harness changes that move an
          # outcome. It does not replace review or code-owner protection, and
          # pushes straight to main do not run it.
          node "$drv/harness-diff.mjs" compare "$RUNNER_TEMP/outcomes-base.json" "$RUNNER_TEMP/outcomes-head.json"

  verify-linux:
    name: Verify package (Linux)
    needs: corpus-gate
    # Runs (and reports) even when the gate failed or was skipped, so the
    # required check is red, not skipped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Corpus baseline gate passed
        env:
          GATE_RESULT: ${{ needs.corpus-gate.result }}
        run: |
          if [ "$GATE_RESULT" != "success" ]; then
            echo "::error::Corpus baseline gate result: $GATE_RESULT"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test chit402-verify
        working-directory: packages/verify
        run: npm install --no-audit --no-fund && npm test

  verify-windows:
    name: Verify package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test chit402-verify
        working-directory: packages/verify
        run: npm install --no-audit --no-fund && npm test

  # ── www unit tests (path-filtered) ─────────────────────────
  # apps/web is not covered by Gateway Tests or Jest (Jest is packages/sdk).
  web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install and test www with no network
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          # ubuntu-latest blocks unprivileged user namespaces until this sysctl is cleared.
          if ! unshare -rn true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Loopback only: the 1f916 link tests (#650 S5) run local test servers on 127.0.0.1.
          unshare -rn sh -c 'ip link set lo up && npm test'

  solana-audit-bundle:
    name: Solana audit bundle secret scan
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the web app with a dummy Helius key
        working-directory: apps/web
        env:
          HELIUS_API_KEY: SECRETDUMMYHELIUSKEY01
        run: npm install --no-audit --no-fund && npm run build

      - name: Grep built JS and source maps
        run: node scripts/check-solana-audit-bundle.mjs

  # ════════════════════════════════════════════════════════════
  # TEMPORARY COMPATIBILITY ALIASES (remove after branch protection update)
  # These satisfy old required check names until founder updates settings.
  # ════════════════════════════════════════════════════════════

  # Old required name from test.yml before PR 280.
  # Real contract tests now run in ci.yml "Core Contract Tests" (path-filtered).
  # Full Hardhat+coverage+gas runs in "Contracts Full Suite" (push-only).
  compat-contracts-listener:
    name: Contracts & Core Listener
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility gate (temporary)
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║ TEMPORARY COMPATIBILITY CHECK                                ║"
          echo "║                                                              ║"
          echo "║ Real contract tests now run as:                              ║"
          echo "║   • CI / Core Contract Tests (path-filtered, PR gate)        ║"
          echo "║   • Tests / Contracts Full Suite (push to main only)         ║"
          echo "║                                                              ║"
          echo "║ Remove this job after updating branch protection rules.      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # Old required name from test.yml before PR 280.
  # Gateway tests now run as "Gateway Tests" (always).
  # SDK tests run in ci.yml "Jest Unit Tests" (path-filtered).
  compat-m2m-sdk-skills:
    name: M2M Backend + SDK + Skills
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility gate (temporary)
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║ TEMPORARY COMPATIBILITY CHECK                                ║"
          echo "║                                                              ║"
          echo "║ These tests are now split into:                              ║"
          echo "║   • Tests / Gateway Tests (always runs)                      ║"
          echo "║   • CI / Jest Unit Tests (SDK, path-filtered)                ║"
          echo "║   • Tests / Theta-Inference Circuit Tests (path-filtered)    ║"
          echo "║   • Tests / Agent Skills Validation (path-filtered)          ║"
          echo "║                                                              ║"
          echo "║ Remove this job after updating branch protection rules.      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # ════════════════════════════════════════════════════════════
  # END TEMPORARY COMPATIBILITY ALIASES
  # ════════════════════════════════════════════════════════════

  # ── Full Hardhat suite + coverage (push to main only) ──────
  # Compile + full test suite + coverage + gas report.
  # Does NOT block PR merge — runs on push to main for audit trail.
  solidity:
    name: Contracts Full Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Generate TypeChain types
        run: npm run typechain

      - name: Core listener (node:test)
        run: npm run test:contracts:core:listener

      - name: Full Hardhat suite (test + circuits + security)
        run: npm run test:contracts:all:hardhat

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solidity-coverage
          path: coverage/

      - name: Gas report (Hardhat core subset)
        run: npm run test:contracts:core:solidity
        env:
          REPORT_GAS: "true"

  # ── Theta-inference circuit tests (path-filtered) ──────────
  # Runs on push to main, or on PRs touching theta-inference paths.
  theta-inference:
    name: Theta-Inference Circuit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.theta-inference == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install theta-inference deps
        working-directory: packages/circuit-runtime/theta-inference
        run: npm install --no-audit --no-fund

      - name: ComputeRouter + _executeService regression tests
        run: node --test packages/circuit-runtime/theta-inference/test/compute-router.test.mjs packages/circuit-runtime/theta-inference/test/execute-service.test.mjs

  # ── Agent Skills validation (path-filtered) ─────────────────
  # Runs on push to main, or on PRs touching agent-skills paths.
  skills:
    name: Agent Skills Validation
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.skills == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Validate Agent Skills (SKILL.md frontmatter)
        run: node scripts/validate-skills.cjs

  # ── XFuel zkLLM prover (push to main or path change) ───────
  # Tier-3 Verified Inference soundness + tamper-rejection suite.
  zkllm:
    name: zkLLM Prover Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.zkllm == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/zkllm-prover

      - name: Run xfuel-zkp tests
        working-directory: services/zkllm-prover
        run: cargo test

      - name: Build benchmark examples
        working-directory: services/zkllm-prover
        run: cargo build --examples

  # ── Slither static analysis (push to main or contracts change) ──
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile contracts (needed for Slither)
        run: npx hardhat compile

      - name: Install Slither
        run: pip3 install "slither-analyzer>=0.10.0,<0.11.0"

      - name: Run Slither on core contracts
        run: |
          slither . \
            --ignore-compile \
            --config-file slither.config.json \
            --include-paths "contracts/core" \
            --exclude-dependencies \
            --exclude naming-convention,solc-version \
            --json slither-report.json || true

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither-report
          path: slither-report.json

      - name: Verify Slither core counter (triage present)
        run: grep -q '_TRIAGED_CORE_HIGH' scripts/slither-count-high-core.py

      - name: Fail on high-severity findings (contracts/core)
        run: |
          if [ -f slither-report.json ]; then
            HIGH=$(python3 scripts/slither-count-high-core.py slither-report.json)
            echo "High-severity findings (contracts/core scope): $HIGH"
            if ! [[ "$HIGH" =~ ^[0-9]+$ ]]; then
              echo "Slither counter did not print a number (got: '$HIGH'). Check scripts/slither-count-high-core.py."
              exit 1
            fi
            if [ "$HIGH" -gt "0" ]; then
              echo "❌ Slither found $HIGH high-severity issue(s) in contracts/core. Review slither-report.json artifact."
              exit 1
            fi
            echo "✅ No high-severity Slither findings in contracts/core."
          fi
