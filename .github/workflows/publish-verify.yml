name: Publish verifier

# The owner approves the release by running this workflow. It does not run on push.
# Trusted publishing uses the id-token. Node 22 runners ship npm 10.x, which
# cannot exchange that token and fail the registry PUT with E404.
# setup-node registry-url writes an _authToken line. npm sends that token and
# skips the OIDC exchange. This job leaves registry auth unset.
# The job runs in the npm-publish environment. Its required reviewer must
# approve each run before any step starts, and its branch rule allows main only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish chit402-verify and the @xfuel/verify alias
    # Job-level guard: a run dispatched from any other ref is skipped before
    # the environment is entered. The step below repeats the check.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/chit402-verify
    steps:
      - name: Publish from main only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "publish runs from refs/heads/main only, got ${GITHUB_REF}"
            exit 1
          fi

      # Actions pinned by commit SHA (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Versions match and the alias pin is exact
        run: node scripts/check-verify-publish.mjs

      # No dependency install scripts: the lockfile has none, and the build
      # and tests run through npm run. npm publish still runs prepack.
      - name: Test chit402-verify
        working-directory: packages/verify
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.21.0
          npm --version
          version="$(npm --version)"
          if [ "$version" != "11.21.0" ]; then
            echo "npm ${version} is not the pinned 11.21.0"
            exit 1
          fi
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if(!(a>11||(a===11&&(b>5||(b===5&&c>=1))))){console.error("npm "+process.argv[1]+" is below 11.5.1"); process.exit(1)}' "$version"

      - name: Remove registry auth before publish
        run: |
          unset NODE_AUTH_TOKEN
          strip_auth() {
            local file="$1"
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              return 0
            fi
            if ! grep -q -e '_authToken' -e 'NODE_AUTH_TOKEN' "$file"; then
              return 0
            fi
            grep -v -e '_authToken' -e 'NODE_AUTH_TOKEN' "$file" > "${file}.stripped" || true
            mv "${file}.stripped" "$file"
          }
          strip_auth "${NPM_CONFIG_USERCONFIG:-}"
          strip_auth "${RUNNER_TEMP:-}/.npmrc"
          strip_auth "${HOME}/.npmrc"
          strip_auth "${GITHUB_WORKSPACE:-}/.npmrc"
          for file in "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc" "${HOME}/.npmrc" "${GITHUB_WORKSPACE:-}/.npmrc"; do
            if [ -n "$file" ] && [ -f "$file" ] && grep -q -e '_authToken' -e 'NODE_AUTH_TOKEN' "$file"; then
              echo "registry auth line remains in ${file}"
              exit 1
            fi
          done

      - name: Publish chit402-verify
        working-directory: packages/verify
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NODE_AUTH_TOKEN+x}" ]; then
            echo "NODE_AUTH_TOKEN is set; refusing to publish"
            exit 1
          fi
          for file in "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc" "${HOME}/.npmrc" "${GITHUB_WORKSPACE:-}/.npmrc"; do
            if [ -n "$file" ] && [ -f "$file" ] && grep -q -e '_authToken' -e 'NODE_AUTH_TOKEN' "$file"; then
              echo "registry auth line remains in ${file}"
              exit 1
            fi
          done
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          seen="$(npm view "${name}@${version}" version --prefer-online 2>/dev/null || true)"
          if [ "$seen" = "$version" ]; then
            echo "${name}@${version} is already published; skipping"
            exit 0
          fi
          # A prerelease (x.y.z-suffix) goes to the `next` dist-tag so `latest` stays on the last release.
          tag_args=""
          case "$version" in
            *-*) tag_args="--tag next" ;;
          esac
          npm publish --provenance --access public --loglevel verbose $tag_args

      - name: Publish @xfuel/verify alias
        working-directory: packages/aliases/chit402-verify
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NODE_AUTH_TOKEN+x}" ]; then
            echo "NODE_AUTH_TOKEN is set; refusing to publish"
            exit 1
          fi
          for file in "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc" "${HOME}/.npmrc" "${GITHUB_WORKSPACE:-}/.npmrc"; do
            if [ -n "$file" ] && [ -f "$file" ] && grep -q -e '_authToken' -e 'NODE_AUTH_TOKEN' "$file"; then
              echo "registry auth line remains in ${file}"
              exit 1
            fi
          done
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          seen="$(npm view "${name}@${version}" version --prefer-online 2>/dev/null || true)"
          if [ "$seen" = "$version" ]; then
            echo "${name}@${version} is already published; skipping"
            exit 0
          fi
          # A prerelease (x.y.z-suffix) goes to the `next` dist-tag so `latest` stays on the last release.
          tag_args=""
          case "$version" in
            *-*) tag_args="--tag next" ;;
          esac
          npm publish --provenance --access public --loglevel verbose $tag_args
