# Compiles contracts/chit-simple from this repo. No copies and no links.
# Compiler profile, shared with test/chit-simple/foundry.toml:
# solc 0.8.24, via IR, optimizer 200, Cancun.
# bytecode_hash none and cbor_metadata false keep the runtime code hash
# independent of the checkout path.
[profile.default]
src = "../../../contracts/chit-simple"
script = "."
out = "out"
cache_path = "cache"
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
remappings = ["chit-simple/=../../../contracts/chit-simple/"]
allow_paths = ["../../../contracts/chit-simple"]
