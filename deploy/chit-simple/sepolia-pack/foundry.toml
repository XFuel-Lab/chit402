# Compiles contracts/chit-simple from this repo. No copies and no links.
# solc 0.8.24, via IR, optimizer 200, Cancun: same profile as hardhat.config.cjs.
[profile.default]
src = "../../../contracts/chit-simple"
script = "."
out = "out"
cache_path = "cache"
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["chit-simple/=../../../contracts/chit-simple/"]
allow_paths = ["../../../contracts/chit-simple"]
