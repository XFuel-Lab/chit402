[package]
name = "xfuel-sp1-hooks"
version = "0.1.0"
edition = "2021"
description = "XFuel Core Layer — SP1 proof generation helpers and circuit interfaces"
license = "MIT"

[dependencies]
# Needs serde's default `std` feature for Vec<u8>/String impls. This was previously
# supplied by feature unification with the CosmWasm workspace members.
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"] }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
# Enable SP1 zkVM guest features (for RISC-V compilation)
sp1-guest = []
# Enable SP1 SDK features (for host/prover)
sp1-host = []
