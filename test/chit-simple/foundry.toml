# ChitAnchor Sepolia v0. Compiler settings match hardhat.config.cjs for 0.8.24
# (via IR, optimizer 200). evm_version is solc 0.8.24's default, which is what
# Hardhat uses when the config does not set one.
[profile.default]
src = "../../contracts/chit-simple"
test = "t"
out = "out"
cache_path = "cache"
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = true
remappings = ["chit-simple/=../../contracts/chit-simple/"]
fs_permissions = [
  { access = "read", path = "../../contracts/chit-simple" },
  { access = "read", path = "../../packages/cs2-core/vectors" },
  { access = "read", path = "../../deploy/chit-simple/sepolia-pack" },
  { access = "read", path = "./cache" },
]
gas_reports = ["ChitAnchor"]

[fuzz]
runs = 64

[invariant]
runs = 64
depth = 25
fail_on_revert = false
