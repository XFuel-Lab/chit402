# ChitAnchor on Base Sepolia, v0.
# Compiler profile, shared with deploy/chit-simple/sepolia-pack/foundry.toml:
# solc 0.8.24, via IR, optimizer 200, Cancun.
# bytecode_hash none and cbor_metadata false keep the runtime code hash
# independent of the checkout path.
[profile.default]
src = "../../contracts/chit-simple"
test = "t"
out = "out"
cache_path = "cache"
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
# cancun is deliberate; Hardhat uses paris.
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
allow_paths = ["../../contracts/chit-simple"]
remappings = ["chit-simple/=../../contracts/chit-simple/"]
fs_permissions = [
  { access = "read", path = "../../contracts/chit-simple" },
  { access = "read", path = "../../packages/cs2-core/vectors" },
  { access = "read", path = "../../deploy/chit-simple/sepolia-pack" },
  { access = "read", path = "./cache" },
]
gas_reports = ["ChitAnchor"]

[fuzz]
runs = 64

[invariant]
runs = 64
depth = 25
fail_on_revert = false
